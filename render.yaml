# Render Blueprint: creates the backend and a free PostgreSQL database in one go.
databases:
  - name: miniledger-db
    plan: free
    databaseName: miniledger

services:
  - type: web
    name: miniledger-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: miniledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SHOW_OTP_IN_RESPONSE
        value: "true"
